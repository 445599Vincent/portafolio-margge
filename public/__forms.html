<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Formulario de contacto</title>
  </head>
  <body>
    <form name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto" />
      <p><label>No completar: <input name="bot-field" /></label></p>
      <p><label>Nombre: <input name="name" type="text" /></label></p>
      <p><label>Empresa: <input name="company" type="text" /></label></p>
      <p><label>Email: <input name="email" type="email" /></label></p>
      <p><label>Tipo de proyecto: <input name="projectType" type="text" /></label></p>
      <p><label>Mensaje: <textarea name="message"></textarea></label></p>
    </form>
  </body>
</html>
